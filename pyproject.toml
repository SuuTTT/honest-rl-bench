[project]
name = "honest-rl-bench"
version = "0.1.0"
description = "An honest RL/MARL benchmarking toolkit + tutorial: learning-curve monitoring, IQM + stratified bootstrap CIs, peak-vs-final reporting, and methodology to avoid cherry-picking."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "SuuTTT"}]
dependencies = ["numpy", "flask"]

[project.optional-dependencies]
plot = ["matplotlib"]

[project.urls]
Homepage = "https://suuttt.github.io/honest-rl-bench/"
Repository = "https://github.com/SuuTTT/honest-rl-bench"
